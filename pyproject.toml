[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nni-model"
version = "0.1.0"
description = "Real NNI per head at constant 2021 PPPs for six economies, with an exact growth decomposition and data quality ratings."
authors = [{name = "Lavan Mahadeva"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["nni_model"]

[tool.setuptools.package-data]
nni_model = ["data/*/*.csv", "data/*/README.md"]
